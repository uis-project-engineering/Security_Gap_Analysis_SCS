<style>

</head>

  { id:"r1", cat:6, q:"発見報告〜初動〜調査〜復旧〜最終報告の対応手順、社内外（当局含む）連絡先と報告ルート、統括役員・担当部署の役割、報告フォーマットがあり、年1回以上点検し、事例を社内共有していますか？", ids:["6-1-1-1", "6-1-1-2", "6-1-1-3", "6-1-1-4", "6-1-1-5", "6-1-1-6"] },
  { id:"c1", cat:7, q:"事業継続上重要なシステムについて、サイバー攻撃を念頭に目標復旧レベル（RTO/RPO）を定め、復旧対策を整備し、リストア手順どおりにRTO内で復元できることを検証していますか？", ids:["7-1-1-1", "7-1-1-2"] }

const ANSWERS = [
  { v:"yes", label:"実施している", key:"1" },
  { v:"partial", label:"一部実施している", key:"2" },
  { v:"no", label:"実施していない　または　不明", key:"3" },
];
const STATUS_LABEL = { yes:"実施済", partial:"一部実施", no:"未実施", none:"未回答" };
const OK="#2E9E6B", MID="#D9952F", NG="#D9596B", GRAY="#C9CFD8", CYAN="#2E5AAC";
function colorOf(s){ return s==="yes"?OK:s==="partial"?MID:s==="no"?NG:GRAY; }

const S = { target:4, answers:{}, idx:0, view:"survey", company:"", detail:{}, detailOpen:{} };

function qs(){ return QUESTIONS.map(q => ({...q, ids:q.ids.filter(id => CMAP[id][1] <= S.target)})).filter(q => q.ids.length>0); }

function compute(list){
  const crit={};
  list.forEach(q => { const a=S.answers[q.id]||"none"; const d=S.detail[q.id]||{}; q.ids.forEach(id => crit[id]=d[id]||a); });
  const byCat={}; Object.keys(CATS).forEach(k => byCat[k]={yes:0,partial:0,no:0,none:0,total:0});
  Object.entries(crit).forEach(([id,s]) => { byCat[id[0]][s]++; byCat[id[0]].total++; });
  const gaps=Object.entries(crit).filter(([,s]) => s==="no"||s==="partial").map(([id,s]) => ({id,s,c:CMAP[id]}));
  const W={no:1,partial:0.5}; const prod={};
  gaps.forEach(({id,s,c}) => {
    const alts=c[3].filter(p => p!==SELF);
    alts.forEach(p => {
      prod[p]=prod[p]||{name:p,ids:[],weight:0,unique:0};
      prod[p].ids.push(id);
      prod[p].weight += W[s]/alts.length;      // 代替製品数で按分（少ないほど価値大）
      if(alts.length===1) prod[p].unique++;    // その製品しか埋められない基準
    });
  });
  const products=Object.values(prod).sort((a,b) => b.weight-a.weight || b.unique-a.unique || b.ids.length-a.ids.length);
  const selfOnly=gaps.filter(({c}) => c[3].every(p => p===SELF));
  const total=Object.values(byCat).reduce((s,c) => s+c.total,0);
  const score=Object.values(byCat).reduce((s,c) => s+c.yes+c.partial*0.5,0);
  return { crit, byCat, gaps, products, selfOnly, total, score };
}

function setView(v){ S.view=v; render(); }
function setTarget(t){ S.target=t; S.idx=0; render(); }
function resetAll(){ if(confirm("回答をすべてクリアします。よろしいですか？")){ S.answers={}; S.idx=0; S.view="survey"; render(); } }
function answer(v){ const list=qs(); const q=list[S.idx]; if(!q)return; S.answers[q.id]=v; delete S.detail[q.id]; delete S.detailOpen[q.id]; if(S.idx<list.length-1){ S.idx++; } else { S.view="result"; } render(); }
function toggleDetail(qid){ S.detailOpen[qid]=!S.detailOpen[qid]; render(); }
function setCrit(qid, cid, v){
  S.detail[qid]=S.detail[qid]||{};
  S.detail[qid][cid] = (S.detail[qid][cid]===v ? undefined : v);
  if(S.detail[qid][cid]===undefined) delete S.detail[qid][cid];
  // 全基準が埋まったら束の判定を自動導出
  const list=qs(); const q=list.find(x=>x.id===qid);
  if(q){
    const d=S.detail[qid]||{};
    const vals=q.ids.map(id=>d[id]);
    if(vals.every(x=>x)){
      S.answers[qid] = vals.every(x=>x==="yes") ? "yes" : vals.every(x=>x==="no") ? "no" : "partial";
    } else {
      delete S.answers[qid];
    }
  }
  render();
}
function go(d){ const list=qs(); S.idx=Math.max(0,Math.min(list.length-1,S.idx+d)); render(); }
function jump(i){ S.idx=i; render(); }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(){
  const list=qs();
  const answered=list.filter(x => S.answers[x.id]).length;
  document.getElementById("tab-survey").className = "tab" + (S.view==="survey"?" on":"");
  document.getElementById("tab-result").className = "tab" + (S.view==="result"?" on":"");
  document.getElementById("s3").className = "starbtn " + (S.target===3?"star-on":"star-off");
  document.getElementById("s4").className = "starbtn " + (S.target===4?"star-on":"star-off");
  document.getElementById("progress").innerHTML = '回答済 <span class="prognum">' + answered + " / " + list.length + '</span>';
  const app=document.getElementById("app");
  if(S.view==="survey"){ app.innerHTML = surveyHTML(list, answered); }
  else { app.innerHTML = resultHTML(list); }
}

function surveyHTML(list, answered){
  const idx=Math.min(S.idx, list.length-1);
  const q=list[idx];
  if(!q) return '<div class="card">対象の設問がありません。</div>';
  const cur=S.answers[q.id];
  const opts=ANSWERS.map(o => {
    const sel=cur===o.v; const col=colorOf(o.v);
    return '<button class="opt'+(sel?' sel':'')+'" style="'+(sel?'border-color:'+col:'')+'" onclick="answer(\''+o.v+'\')">'+
      '<span class="optkey" style="'+(sel?'background:'+col+';color:#1F2A66':'')+'">'+o.key+'</span>'+
      '<span class="optlabel">'+esc(o.label)+'</span></button>';
  }).join("");
  const dots=list.map((x,i) => {
    const st=S.answers[x.id]; const c=i===idx;
    const base=list.length>38?9:list.length>30?10:11;
    const sz=c?base+5:base;
    return '<button class="dot" title="Q'+(i+1)+'" onclick="jump('+i+')" style="width:'+sz+'px;height:'+sz+'px;background:'+(st?colorOf(st):(c?"#1F2A66":"#C9CFD8"))+';'+(c?"box-shadow:0 0 0 3px rgba(31,42,102,0.22)":"")+'"></button>';
  }).join("");
  const detailBlock='';

  return '<div class="card">'+
    '<div class="qmeta"><span class="qcat">'+q.cat+'. '+esc(CATS[q.cat])+'</span><span>全 '+list.length+' 問中 '+(idx+1)+' 問目／あと '+(list.length-answered)+' 問</span></div>'+
    '<div class="qtext">'+esc(q.q)+'</div>'+
    '<div class="qhint"><span style="color:#8A93A6;">対象の評価基準 '+q.ids.join("　")+'</span></div>'+
    '<div class="opts">'+opts+'</div>'+detailBlock+
    '<div class="nav"><button class="navbtn" '+(idx===0?"disabled":"")+' onclick="go(-1)">← 前へ</button>'+
    (idx<list.length-1 ? '<button class="navbtn primary" onclick="go(1)">次へ →</button>' : '<button class="navbtn primary" onclick="setView(\'result\')">結果を見る</button>')+
    '</div><div class="dots">'+dots+'</div></div>';
}

function catBreakdown(ids){
  const cnt={};
  ids.forEach(id => { const k=id[0]; cnt[k]=(cnt[k]||0)+1; });
  return Object.keys(cnt).sort().map(k => esc(CATS[k].replace("の整備","").replace("攻撃等の","").replace("インシデントへの","").replace("インシデントからの","").replace("リスクの","リスク"))+" "+cnt[k]).join("・");
}
function resultHTML(list){
  const r=compute(list);
  const rp=r.total?Math.round((r.score/r.total)*100):0;
  const noCount=r.gaps.filter(g=>g.s==="no").length;
  const partialCount=r.gaps.filter(g=>g.s==="partial").length;
  const noneCount=Object.values(r.crit).filter(x=>x==="none").length;
  const pctColor=rp>=80?OK:rp>=50?MID:NG;
  const stats=[["未実施",noCount,NG],["一部実施",partialCount,MID],["規程・運用で対応",r.selfOnly.length,"#1A2233"]];
  if(noneCount>0) stats.push(["未回答",noneCount,"#6B7689"]);
  const statHTML=stats.map(([l,v,c]) => '<div class="stat"><div style="font-size:11.5px;font-weight:700;color:#6B7689;">'+l+'</div><div style="font-size:26px;font-weight:700;color:'+c+';margin-top:3px;">'+v+'<span style="font-size:12px;color:#6B7689;margin-left:3px;">件</span></div></div>').join("");

  const catHTML=Object.keys(CATS).map(k => {
    const c=r.byCat[k]; if(!c.total) return "";
    const pct=Math.round((c.yes+c.partial*0.5)/c.total*100);
    const pc=pct>=80?OK:pct>=50?MID:NG;
    // cells
    let cells=""; const order=[["yes",c.yes],["partial",c.partial],["no",c.no],["none",c.none]];
    order.forEach(([st,n]) => { for(let i=0;i<n;i++) cells+='<span style="flex:1;background:'+colorOf(st)+';border-radius:2px;"></span>'; });
    return '<div class="catcard"><div style="font-size:11px;font-weight:700;color:#8A93A6;">'+k+'</div>'+
      '<div style="font-size:12px;font-weight:700;line-height:1.45;min-height:34px;margin-top:3px;color:#1A2233;">'+esc(CATS[k])+'</div>'+
      '<div style="font-size:24px;font-weight:700;margin:7px 0 8px;color:'+pc+'">'+pct+'<span style="font-size:12px;color:#6B7689;">%</span></div>'+
      '<div style="display:flex;gap:1px;height:10px;">'+cells+'</div></div>';
  }).join("");

  // ===== 対策サービス：サポートアカデミー=規程レイヤー(AND) / 他ツール=代替可(OR) =====
  const W2={no:1,partial:0.5};
  const SAPO="サポートアカデミー";
  // 規程レイヤー：サポートアカデミーがマッピングされた不足基準（ツール導入だけでは満たせない）
  const sapoGaps=r.gaps.filter(({c}) => c[3].includes(SAPO));
  // ツールレイヤー：サポートアカデミー・SELF以外の製品で対応できる不足基準
  const pm={};
  r.gaps.forEach(({id,s,c}) => {
    const alts=c[3].filter(p => p!==SELF && p!==SAPO);
    alts.forEach(p => {
      pm[p]=pm[p]||{name:p,ids:[],sts:{},rawW:0};
      pm[p].ids.push(id); pm[p].sts[id]=s; pm[p].rawW+=W2[s];
    });
  });
  const denom={};
  CRITERIA.forEach(c => { if(c[1]<=S.target) c[3].forEach(p => { if(p!==SELF&&p!==SAPO) denom[p]=(denom[p]||0)+1; }); });
  Object.values(pm).forEach(p => { p.fit = denom[p.name] ? p.ids.length/denom[p.name] : 0; });

  // ツールの推奨セット（貪欲法・サポートアカデミー抜き）
  const toolGaps=r.gaps.filter(({c}) => c[3].some(p => p!==SELF && p!==SAPO));
  const totalCovW=toolGaps.reduce((s,{s:st}) => s+W2[st],0);
  const setPicks=[];
  { const remaining=new Set(toolGaps.map(g=>g.id));
    const stById={}; toolGaps.forEach(g=>stById[g.id]=g.s);
    while(remaining.size>0 && setPicks.length<5){
      let best=null,bestW=0,bestIds=null;
      Object.values(pm).forEach(p => {
        const cov=p.ids.filter(id=>remaining.has(id));
        const w=cov.reduce((s,id)=>s+W2[stById[id]],0);
        if(w>bestW){ best=p; bestW=w; bestIds=cov; }
      });
      if(!best||bestW<=0) break;
      bestIds.forEach(id=>remaining.delete(id));
      const coveredW=totalCovW-[...remaining].reduce((s,id)=>s+W2[stById[id]],0);
      setPicks.push({p:best, addIds:bestIds, cumPct: totalCovW?Math.round(coveredW/totalCovW*100):0});
      if(setPicks[setPicks.length-1].cumPct>=90) break;
    }
  }
  const inSet=new Set(setPicks.map(x=>x.p.name));

  function prodCard(rankLabel, p, panelIds, note){
    return '<div class="prod"><button class="prodhead" onclick="var e=this.nextElementSibling;e.style.display=e.style.display===\'block\'?\'none\':\'block\'">'+
      '<span class="rank">'+rankLabel+'</span>'+
      '<span><span style="display:block;font-size:14.5px;font-weight:700;">'+esc(p.name)+'</span>'+
      '<span style="display:block;font-size:11.5px;color:#6B7689;margin-top:3px;">'+esc(note!==undefined?note:(PRODUCT_NOTE[p.name]||""))+'</span></span>'+
      '<span></span>'+
      '</button><div style="display:none;padding:0 16px 14px;">'+
      panelIds.map(id => '<div style="display:grid;grid-template-columns:10px 70px 1fr;gap:10px;font-size:12px;padding:4px 0;color:#3D4A63;align-items:baseline;">'+
        '<span style="width:8px;height:8px;border-radius:99px;background:'+colorOf(p.sts[id]||"no")+';align-self:center;"></span>'+
        '<span style="color:#8A93A6;font-weight:700;">'+id+'</span><span>'+esc(CMAP[id][2])+'</span></div>').join("")+
      '</div></div>';
  }
  function shelfHead(title, note){
    return '<div class="shelfhead"><div style="margin:20px 0 4px;font-size:13.5px;font-weight:700;color:#1A2233;">'+title+'</div>'+
      '<div style="font-size:11.5px;color:#6B7689;margin-bottom:10px;">'+note+'</div></div>';
  }

  let servicesHTML='';
  if(sapoGaps.length===0 && Object.keys(pm).length===0){
    servicesHTML='<div style="color:#6B7689;font-size:13px;">製品・サービスで補う不足基準はありません。</div>';
  } else {
    // 棚0: 規程・運用の整備（サポートアカデミー＝常に併用が前提）
    if(sapoGaps.length>0){
      const sapoP={name:SAPO, sts:{}};
      sapoGaps.forEach(g => sapoP.sts[g.id]=g.s);
      servicesHTML+=shelfHead('まず必要：社内ルール・運用の整備',
        'ツールを導入するだけでは満たせない項目です。社内ルールの整備とセットで進める必要があります（サポートアカデミーで伴走支援が可能）。');
      servicesHTML+=prodCard('必', sapoP, sapoGaps.map(g=>g.id),
        '規程・体制・ルール整備の伴走支援（対象 '+sapoGaps.length+' 項目）');
    }
    // 棚1: ツールの組み合わせ
    if(setPicks.length>0){
      const marks=["①","②","③","④","⑤"];
      servicesHTML+=shelfHead('おすすめのツールの組み合わせ',
        '少ない数で不足を幅広くカバーできる順に選んでいます。番号の順に、上記のルール整備とあわせてご検討ください。');
      servicesHTML+=setPicks.map((x,i) => prodCard(marks[i], x.p, x.addIds)).join("");
    }
    // 棚2: ピンポイント
    const point=Object.values(pm).filter(p=>!inSet.has(p.name)).sort((a,b)=>b.fit-a.fit||b.rawW-a.rawW).slice(0,4);
    if(point.length){
      servicesHTML+=shelfHead('あわせて検討したいサービス',
        '対応できる範囲は限られますが、貴社に不足している部分をピンポイントで補えるサービスです。');
      servicesHTML+=point.map(p => prodCard('・', p, p.ids)).join("");
    }
  }
  // 規程・運用で対応（SELFのみのギャップ）の中身リスト
  const selfSorted=[...r.selfOnly].sort((a,b) => (a.s===b.s?0:a.s==="no"?-1:1) || a.id.localeCompare(b.id));
  const selfSection = r.selfOnly.length ? '<div class="section pagebreak"><h2 style="font-size:16px;font-weight:700;margin:0 0 5px;">規程・運用での対応が必要な項目（'+r.selfOnly.length+' 件）</h2>'+
    '<div style="font-size:12.5px;color:#6B7689;margin-bottom:16px;">製品では代替できず、社内の規程整備・運用で満たす評価基準です。取引先管理・ガバナンス領域が中心になります。</div>'+
    selfSorted.map(({id,s,c}) => '<div style="display:grid;grid-template-columns:10px 76px 64px 1fr;gap:12px;align-items:baseline;font-size:13px;padding:7px 0;border-bottom:1px solid #E8EBF0;">'+
      '<span style="width:8px;height:8px;border-radius:99px;background:'+colorOf(s)+';align-self:center;"></span>'+
      '<span style="font-weight:700;color:#8A93A6;">'+id+'</span>'+
      '<span style="font-weight:700;color:'+colorOf(s)+';">'+STATUS_LABEL[s]+'</span>'+
      '<span style="color:#2A3547;line-height:1.6;">'+esc(c[2])+'</span></div>').join("")+'</div>' : "";

  // 最弱分野（回答済みで充足率最下位）
  let weakest=null;
  Object.keys(CATS).forEach(k => {
    const c=r.byCat[k]; if(!c.total) return;
    const answeredInCat=c.total-c.none; if(answeredInCat===0) return;
    const pct=Math.round((c.yes+c.partial*0.5)/c.total*100);
    if(!weakest || pct<weakest.pct) weakest={k, pct};
  });
  const summary="★"+S.target+"の取得に向けて、未実施 "+noCount+" 件、一部実施 "+partialCount+" 件"+(noneCount>0?"、未回答 "+noneCount+" 件":"")+" の評価基準があります。うち "+r.selfOnly.length+" 件は規程・運用での対応が中心です。"+
    (weakest ? '<br><span style="color:'+(weakest.pct>=80?OK:weakest.pct>=50?MID:NG)+';font-weight:700;">最優先で底上げすべき分野：'+weakest.k+'. '+esc(CATS[weakest.k])+'（充足率 '+weakest.pct+'%）</span>' : "");

  const company=(S.company||"").trim();
  const today=new Date().toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric"});
  const printHead='<div class="printhead"><div style="font-size:21px;font-weight:700;letter-spacing:0.04em;">'+esc(company||"貴社")+'　御中</div>'+
    '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:#6B7689;margin-top:6px;"><span>SCS ギャップ診断　★'+S.target+' 取得に向けた現状診断結果</span><span>'+today+'</span></div></div>';

  return printHead+'<div class="hero"><div style="min-width:190px;">'+
    '<div style="font-size:11.5px;font-weight:700;letter-spacing:0.12em;color:#2E5AAC;">★'+S.target+' 基準の充足率</div>'+
    '<div style="display:flex;align-items:flex-end;gap:3px;margin-top:4px;"><div class="pct" style="color:'+pctColor+'">'+rp+'</div><div style="font-size:22px;font-weight:700;color:#B9C6FF;padding-bottom:12px;">%</div></div>'+
    '<div style="font-size:12.5px;font-weight:700;color:#6B7689;">評価基準 '+r.total+' 件</div></div>'+
    '<div style="display:grid;gap:12px;"><div style="display:flex;gap:10px;flex-wrap:wrap;">'+statHTML+'</div>'+
    '<div style="font-size:13.5px;line-height:1.9;color:#2A3547;">'+summary+'</div></div></div>'+
    '<div class="section"><h2 style="font-size:16px;font-weight:700;margin:0 0 18px;">分野別の状況</h2><div class="grid7">'+catHTML+'</div>'+
    '<div style="display:flex;gap:18px;margin-top:15px;font-size:11.5px;font-weight:700;color:#6B7689;align-items:center;flex-wrap:wrap;">'+
    '<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:'+OK+'"></span>実施済</span>'+
    '<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:'+MID+'"></span>一部実施</span>'+
    '<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:'+NG+'"></span>未実施</span>'+
    '<span style="display:inline-flex;align-items:center;gap:6px;"><span style="width:12px;height:12px;border-radius:3px;background:'+GRAY+'"></span>未回答</span>'+
    '<span style="margin-left:auto;">1マス＝評価基準1件</span></div></div>'+
    '<div class="section pagebreak"><h2 style="font-size:16px;font-weight:700;margin:0 0 5px;">★'+S.target+' 取得に向けた対策サービス</h2>'+
    '<div style="font-size:12.5px;color:#6B7689;margin-bottom:4px;">カードをクリックすると対象の評価基準を確認できます。</div>'+servicesHTML+'</div>'+
    selfSection;
}

document.addEventListener("keydown", e => {
  if(S.view!=="survey") return;
  if(e.key==="1") answer("yes");
  else if(e.key==="2") answer("partial");
  else if(e.key==="3") answer("no");
  else if(e.key==="ArrowLeft") go(-1);
  else if(e.key==="ArrowRight") go(1);
});
render();
</script>
</body>
